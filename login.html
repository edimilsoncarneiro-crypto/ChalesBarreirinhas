<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Acesso | Chalés Barreirinhas</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e2e8f0; background: radial-gradient(circle at 15% 10%, #12332f 0, transparent 35%), #07111f; }
    .card { width: min(100%, 420px); padding: 34px; border: 1px solid #253347; border-radius: 20px; background: rgba(15, 23, 42, .94); box-shadow: 0 24px 80px rgba(0, 0, 0, .42); }
    .mark { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 22px; border-radius: 14px; color: #052e22; background: linear-gradient(135deg, #34d399, #a3e635); font-size: 22px; }
    h1 { margin: 0; color: #f8fafc; font-size: 23px; letter-spacing: -.02em; }
    .subtitle { margin: 8px 0 26px; color: #94a3b8; font-size: 14px; line-height: 1.55; }
    label { display: block; margin: 17px 0 7px; color: #cbd5e1; font-size: 13px; font-weight: 650; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #334155; border-radius: 10px; outline: none; color: #f8fafc; background: #0b1423; font: inherit; }
    input:focus { border-color: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .13); }
    .hint { margin: 7px 0 0; color: #64748b; font-size: 12px; }
    button { width: 100%; margin-top: 23px; padding: 12px; border: 0; border-radius: 10px; color: #052e22; background: #34d399; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #6ee7b7; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { min-height: 20px; margin: 13px 0 0; color: #fda4af; font-size: 13px; line-height: 1.45; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">⌂</div>
    <h1 id="title">Acessar o sistema</h1>
    <p class="subtitle" id="subtitle">Entre com sua senha para abrir o controle dos Chalés Barreirinhas.</p>
    <form id="auth-form">
      <div id="setup-token-field" class="hidden">
        <label for="setup-token">Código de configuração</label>
        <input id="setup-token" name="setupToken" autocomplete="one-time-code" spellcheck="false">
        <p class="hint">O código aparece na janela do servidor na primeira inicialização.</p>
      </div>
      <label for="username">Login</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}">
      <p id="username-hint" class="hint hidden">Use de 3 a 32 caracteres: letras, números, ponto, hífen ou sublinhado.</p>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <div id="confirmation-field" class="hidden">
        <label for="password-confirm">Confirme a senha</label>
        <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="128">
        <p class="hint">Use pelo menos 12 caracteres.</p>
      </div>
      <button id="submit-button" type="submit">Entrar</button>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const button = document.getElementById('submit-button');
    const message = document.getElementById('message');
    let setupMode = false;

    async function initialize() {
      try {
        const response = await fetch('/api/auth/status', { cache: 'no-store' });
        const status = await response.json();
        if (!response.ok) throw new Error('Não foi possível verificar o acesso.');
        if (status.authenticated) return window.location.replace('/');
        setupMode = !status.configured;
        if (setupMode) {
          title.textContent = 'Criar acesso';
          subtitle.textContent = 'Configure a senha que será usada para acessar este sistema.';
          document.getElementById('setup-token-field').classList.remove('hidden');
          document.getElementById('confirmation-field').classList.remove('hidden');
          document.getElementById('username-hint').classList.remove('hidden');
          document.getElementById('password').autocomplete = 'new-password';
          document.getElementById('password').minLength = 12;
          button.textContent = 'Criar senha e entrar';
        }
      } catch (error) {
        message.textContent = 'Servidor indisponível. Inicie o sistema pelo arquivo iniciar.bat.';
        button.disabled = true;
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const password = document.getElementById('password').value;
      const payload = {
        username: document.getElementById('username').value.trim(),
        password
      };
      if (setupMode) {
        if (password !== document.getElementById('password-confirm').value) {
          message.textContent = 'As senhas não conferem.';
          return;
        }
        payload.setupToken = document.getElementById('setup-token').value.trim();
      }

      button.disabled = true;
      try {
        const endpoint = setupMode ? '/api/auth/setup' : '/api/auth/login';
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Não foi possível autenticar.');
        window.location.replace('/');
      } catch (error) {
        message.textContent = error.message || 'Falha de conexão com o servidor.';
        button.disabled = false;
      }
    });

    initialize();
  </script>
</body>
</html>
